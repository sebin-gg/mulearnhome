name: Temporary lockfile remediation
on:
  push:
    branches:
      - codex/dependabot-lockfile-mulearnhome
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Update vulnerable lockfile dependencies
        id: audit
        continue-on-error: true
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Commit lockfile only
        if: steps.audit.outcome == 'success' || steps.audit.outcome == 'failure'
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          if [ "$changed" != "package-lock.json" ]; then
            printf 'Unexpected changed files:\n%s\n' "$changed"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): remediate vulnerable lockfile packages"
          git push origin HEAD:refs/heads/codex/dependabot-lockfile-mulearnhome